[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }]

# See https://book.getfoundry.sh/reference/config/ for all options.

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
